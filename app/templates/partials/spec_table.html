{% macro spec_table(group, show_heading=True) %}
  {% if group.fields %}
    <div class="spec-group">
      {% if show_heading %}<h3>{{ group.label }}</h3>{% endif %}
      <table class="spec-table">
        <tbody>
          {% for field in group.fields %}
            <tr>
              <th>{{ field.label }}</th>
              <td>{{ field.display_value }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% endif %}
{% endmacro %}
