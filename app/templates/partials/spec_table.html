{% macro spec_table(group) %}
  {% if group.fields %}
    <div class="spec-group">
      <h3>{{ group.label }}</h3>
      <table class="spec-table">
        <tbody>
          {% for field in group.fields %}
            <tr>
              <th>{{ field.label }}</th>
              <td>{{ field.display_value }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  {% endif %}
{% endmacro %}
